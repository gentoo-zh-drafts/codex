
name: Create crate dist
on:
  push:
    tags:
      - '**'

jobs:
  crate-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create crate dist
        uses: projg2/crate-dist-action@v1
        with:
          directories: codex-rs/cli
          dist-filename: codex-voice-cygwin-108b38cf67cbb731-crates.tar.xz
          run-cargo-update: false

