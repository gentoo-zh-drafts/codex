
name: Create crate dist
on:
  push:
    tags:
      - '**'

jobs:
  crate-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create crate dist
        uses: gentoo-zh-drafts/codex/.github/actions/crate-dist@crate-dist
        with:
          directories: codex-rs/cli
          dist-filename: codex-rust-v0.166.0-alpha.6-crates.tar.xz
          run-cargo-update: false

