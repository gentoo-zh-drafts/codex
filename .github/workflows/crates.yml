name: Sync with upstream
on:
  push:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

jobs:
  sync-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Update mirror
        uses: projg2/crate-dist-mirror-action@v2
        with:
          ssh-private-key: ${{ secrets.ssh_key }}
          directories: codex-rs/cli
          # Temporary: patched pycargoebuild for microsoft/mxc's mxc-sdk, see
          # .github/actions/crate-dist/action.yml.
          crate-dist-action: gentoo-zh-drafts/codex/.github/actions/crate-dist@crate-dist
